[workspace]
authors = ["AXIBA <leolihao@arizona.edu>"]
channels = ["conda-forge"]
name = "rocm-pytorch-bundle"
platforms = ["win-64"]
version = "0.2.0"

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "*"
pillow = ">=12,<13"
libpng = ">=1.6,<2"
libjpeg-turbo = ">=3,<4"
libwebp-base = ">=1.6,<2"

# Runtime-only local wheels. After `pixi run export-runtime-bundle -- <dir>`,
# this folder is a ready pixi project: `cd <dir>; pixi install`. Other repos
# can pin the same wheels by path from <dir>/dependencies/. Copying this
# folder and editing pixi.toml is optional. Do not add rocm-sdk-devel.
[pypi-dependencies]
numpy = { path = "dependencies/numpy-2.1.2-cp312-cp312-win_amd64.whl" }
torch = { path = "dependencies/torch-2.15.0a0+rocm7.13.0-cp312-cp312-win_amd64.whl" }
torchvision = { path = "dependencies/torchvision-0.30.0a0+rocm7.13.0-cp312-cp312-win_amd64.whl" }
filelock = { path = "dependencies/filelock-3.20.0-py3-none-any.whl" }
"typing-extensions" = { path = "dependencies/typing_extensions-4.15.0-py3-none-any.whl" }
sympy = { path = "dependencies/sympy-1.13.3-py3-none-any.whl" }
mpmath = { path = "dependencies/mpmath-1.3.0-py3-none-any.whl" }
networkx = { path = "dependencies/networkx-2.8.8-py3-none-any.whl" }
jinja2 = { path = "dependencies/jinja2-3.1.6-py3-none-any.whl" }
markupsafe = { path = "dependencies/markupsafe-3.0.3-cp312-cp312-win_amd64.whl" }
fsspec = { path = "dependencies/fsspec-2025.9.0-py3-none-any.whl" }
rocm = { path = "dependencies/rocm-7.13.0-py3-none-any.whl" }
"rocm-sdk-core" = { path = "dependencies/rocm_sdk_core-7.13.0-py3-none-win_amd64.whl" }
"rocm-sdk-libraries-gfx103x-all" = { path = "dependencies/rocm_sdk_libraries_gfx103x_all-7.13.0-py3-none-win_amd64.whl" }
